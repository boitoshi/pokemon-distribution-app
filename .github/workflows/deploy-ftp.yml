name: Deploy search app to pokebros.net (FTP)

# 本番（ConoHa）への FTP デプロイ。docs/deploy.md の「②本番」を手作業から移したもの。
#
# なぜ Actions でやるか:
#   FTP 資格情報を各作業環境（Mac / Codespaces）に撒かずに済み、
#   どの環境からも `gh workflow run` で同じ手順が踏める。
#   起動は pokebros-content-hub の `bash scripts/ftp-deploy.sh search-app` が入口。
#
# 配置先は /distribution/search/ で、summary-pages（/distribution/ 直下）とは
# ディレクトリが分かれている。互いの sync state file も混ざらない。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run（アップロードせず転送内容のみ表示）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ftp-deploy-search
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::リポジトリSecretsが未設定です:$missing（Settings → Secrets and variables → Actions で設定してください）"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run smoke

      # DEPLOY_TARGET=production。base が /distribution/search になる。
      # ベータ用ビルド（npm run build）を上げると base が食い違って CSS/画像が死ぬ。
      - run: npm run build:prod

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './distribution/search/' }}
          dry-run: ${{ inputs.dry_run }}
